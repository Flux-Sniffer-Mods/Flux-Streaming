name: Flux build
# Each run is named by its version (or its kind, when the version is worked out)
run-name: ${{ inputs.version_name || (github.ref_name == 'flux-release' && 'release' || 'dev build') }}

# Pick the branch to pick the kind of build:
#   flux-release -> a full release (1.0): the newest version in whats_new.json's "releases"
#   flux-dev     -> a dev build (1.0.1-flux.<yyyyMMddHHmm>) numbered after that release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (leave empty to work it out from the branch)"
        required: false
        default: ""
        type: string
      notes_since:
        description: "Release notes since this build (leave empty for the build before)"
        required: false
        default: ""
        type: string

# One build at a time: each works out its version and "the build before" once the previous one has published
concurrency:
  group: flux-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout (with Flux Core)
        uses: actions/checkout@v4
        with:
          submodules: true
          # What's new: each entry's time comes from the commit that added it
          fetch-depth: 0

      # The app this repository builds: its name, and its APK's (.github/app.env)
      - name: The app's name
        run: |
          cat .github/app.env >> "$GITHUB_ENV"
          cat .github/app.env

      - name: Work out the version
        id: version
        env:
          GIVEN: ${{ inputs.version_name }}
        run: python3 .github/scripts/flux_release.py version "$GITHUB_REF_NAME" "$GIVEN" | tee -a "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (caches dependencies and build outputs between runs)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Signing config
        env:
          KEYSTORE_B64: ${{ secrets.PASTIERA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PASTIERA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PASTIERA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PASTIERA_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::The signing secrets aren't set"; exit 1; }
          mkdir -p release
          echo "$KEYSTORE_B64" | base64 -d > release/flux-release.jks
          cat > release/keystore.properties <<EOF
          storeFile=flux-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Stamp What's new
        run: python3 .github/scripts/flux_release.py stamp

      - name: Build the signed APK, and test
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew --build-cache :app:assembleRelease :app:testDebugUnitTest :core:testDebugUnitTest \
            -PFLUX_VERSION_CODE=${{ steps.version.outputs.code }} -PFLUX_VERSION_NAME=${{ steps.version.outputs.name }}

      - name: Collect the APK and its notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          NOTES_SINCE: ${{ inputs.notes_since }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/$APK_NAME-$VERSION.apk"
          # Notes since the build before: for a full release the previous full release, for a dev
          # build the previous build of either kind (by when it was published)
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,publishedAt,isDraft \
            --jq "[.[] | select(.isDraft | not) | select(.tagName | startswith(\"flux/v\")) | select(.tagName != \"flux/v$VERSION\")] | sort_by(.publishedAt) | last | .tagName // \"\"")
          if [ -n "$NOTES_SINCE" ]; then previous="flux/v${NOTES_SINCE#flux/v}"; fi
          python3 .github/scripts/flux_release.py notes "$VERSION" "$previous" "$GITHUB_SHA" > out/RELEASE_NOTES.md
          cat out/RELEASE_NOTES.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            out/*.apk
            out/RELEASE_NOTES.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
          if-no-files-found: ignore

      # The app checks this repository's "flux/" releases for updates. Published with a
      # RELEASE_TOKEN secret (the owner's token) when it's set and accepted, else as github-actions[bot]
      - name: Publish release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BUILTIN_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          GH_TOKEN="$RELEASE_TOKEN"
          if [ -z "$GH_TOKEN" ] || ! GH_TOKEN="$GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [ -n "$RELEASE_TOKEN" ] && echo "::warning::RELEASE_TOKEN was turned down: published as github-actions[bot] instead."
            GH_TOKEN="$BUILTIN_TOKEN"
          fi
          export GH_TOKEN
          case "$VERSION" in
            *-flux.*)
              stamp="${VERSION##*.}"
              when=$(date -u -d "${stamp:0:8} ${stamp:8:2}:${stamp:10:2}" "+%-d %b %Y, %H:%M" 2>/dev/null || echo "$stamp")
              title="$APP_TITLE ${VERSION%%-*} dev · $when"
              kind="--prerelease" ;;
            *) title="$APP_TITLE $VERSION"
              kind="--latest"
              # A full release replaces the dev builds before it
              gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' |
                grep -- '-flux\.' | while read -r tag; do
                  gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
                done ;;
          esac
          if gh release view "flux/v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "flux/v$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/flux/v$VERSION" >/dev/null 2>&1 || true
          fi
          gh release create "flux/v$VERSION" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file out/RELEASE_NOTES.md \
            $kind

  # A successful build replaces the runs before it (releases keep their APKs)
  cleanup:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .status == \"completed\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1 || true
            done
